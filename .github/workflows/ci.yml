name: SsibuChat CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Export generated npm lockfile for deterministic dependency pinning
        uses: actions/upload-artifact@v4
        with:
          name: ssibuchat-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Persist generated lockfile to this repository's pull-request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(deps): add deterministic npm lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Dependency audit summary
        run: npm audit --json > npm-audit.json || true
      - name: Report dependency advisories
        run: node -e 'const a=require("./npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name+" "+v.severity+" direct="+v.isDirect+" fix="+JSON.stringify(v.fixAvailable)+" via="+JSON.stringify(v.via)); console.log("totals",JSON.stringify(a.metadata?.vulnerabilities||{}));'
      - run: npm run build
